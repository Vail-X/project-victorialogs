apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: victoria-logs-cluster.rules
  labels:
    app.kubernetes.io/name: victoria-logs-cluster
    app.kubernetes.io/instance: vlc
spec:
  groups:
    - name: vl.availability
      rules:
        - alert: ComponentDown
          expr: |
            up{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"} == 0
            or
            absent_over_time(up{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}[1m])
          for: 2m
          labels:
            severity: critical
            service: victoria-logs
          annotations:
            summary: 'Component Down/Missing ({{ $labels.job }})'
            description: |
              The critical component (Job: {{ $labels.job }}) has been unavailable for more than 2 minutes.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}
              {{ if $labels.instance }} Instance: {{ $labels.instance }}{{ end }}

    - name: vl.component.resources
      rules:
        - alert: ComponentCPUHigh
          expr: |
            rate(process_cpu_seconds_total{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}[5m])
            /
            process_cpu_cores_available{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.0001
          for: 5m
          labels:
            severity: warning
            resource: cpu
          annotations:
            summary: 'CPU High ({{ $labels.job }}) - {{ $value | printf "%.5f%%" }}'
            description: '{{ $labels.job }} is using over 75% of its available CPU cores for more than 5 minutes.'

        - alert: ComponentCPUCritical
          expr: |
            rate(process_cpu_seconds_total{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}[5m])
            /
            process_cpu_cores_available{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.90
          for: 2m
          labels:
            severity: critical
            resource: cpu
          annotations:
            summary: 'CPU Critical ({{ $labels.job }}) - {{ $value | printf "%.5f%%" }}'
            description: '{{ $labels.job }} is utilizing over 90% of its available CPU and is at risk of throttling.'

        - alert: ComponentMemoryHigh
          expr: |
            process_resident_memory_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            /
            process_memory_limit_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.001
          for: 10m
          labels:
            severity: warning
            resource: memory
          annotations:
            summary: 'Memory High ({{ $labels.job }}) - {{ $value | printf "%.5f%%" }}'
            description: '{{ $labels.job }} is using over 75% of its allocated memory for more than 10 minutes.'

        - alert: ComponentMemoryCritical
          expr: |
            process_resident_memory_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            /
            process_memory_limit_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.90
          for: 2m
          labels:
            severity: critical
            resource: memory
          annotations:
            summary: 'Memory Critical ({{ $labels.job }}) - {{ $value | printf "%.5f%%" }}'
            description: '{{ $labels.job }} is using over 90% of its memory and is at severe risk of OOM kill.'

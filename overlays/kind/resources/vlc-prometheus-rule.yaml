apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: victoria-logs-cluster.rules
  labels:
    app.kubernetes.io/name: victoria-logs-cluster
    app.kubernetes.io/instance: vlc
spec:
  groups:
    - name: vl.availability
      rules:
        - alert: VLSelectDown
          expr: up{job="vlc-victoria-logs-cluster-vlselect"} == 0 or absent_over_time(up{job="vlc-victoria-logs-cluster-vlselect"}[1m])
          for: 2m
          labels:
            severity: critical
            component: vlselect
            service: victoria-logs
          annotations:
            summary: 'VLSelect is down'
            description: |
              VLSelect instance is down and not responding.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}
              {{ if $labels.instance }}Instance: {{ $labels.instance }}{{ end }}

        - alert: VLInsertDown
          expr: up{job="vlc-victoria-logs-cluster-vlinsert"} == 0 or absent_over_time(up{job="vlc-victoria-logs-cluster-vlinsert"}[1m])
          for: 2m
          labels:
            severity: critical
            component: vlinsert
            service: victoria-logs
          annotations:
            summary: 'VLInsert is down'
            description: |
              VLInsert instance is down and not responding.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}
              {{ if $labels.instance }}Instance: {{ $labels.instance }}{{ end }}

        - alert: VLStorageDown
          expr: up{job="vlc-victoria-logs-cluster-vlstorage"} == 0 or absent_over_time(up{job="vlc-victoria-logs-cluster-vlstorage"}[1m])
          for: 2m
          labels:
            severity: critical
            component: vlstorage
            service: victoria-logs
          annotations:
            summary: 'VLStorage is down'
            description: |
              VLStorage instance is down and not responding.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}
              {{ if $labels.instance }}Instance: {{ $labels.instance }}{{ end }}

        - alert: VMAuthDown
          expr: up{job="vlc-victoria-logs-cluster-vmauth"} == 0 or absent_over_time(up{job="vlc-victoria-logs-cluster-vmauth"}[1m])
          for: 2m
          labels:
            severity: critical
            component: vmauth
            service: victoria-logs
          annotations:
            summary: 'VMAuth is down'
            description: |
              VMAuth instance is down and not responding.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}
              {{ if $labels.instance }}Instance: {{ $labels.instance }}{{ end }}

    - name: vl.component.resources
      rules:
        - alert: ComponentCPUHigh
          expr: |
            rate(process_cpu_seconds_total{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}[5m])
            /
            process_cpu_cores_available{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.75
          for: 2m
          labels:
            severity: warning
            resource: cpu
          annotations:
            summary: 'CPU High ({{ $labels.job }}) - {{ $value | printf "%.2f%%" }}'
            description: |
              {{ $labels.job }} is using over 75% of its available CPU cores.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}

        - alert: ComponentCPUCritical
          expr: |
            rate(process_cpu_seconds_total{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}[5m])
            /
            process_cpu_cores_available{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.90
          for: 2m
          labels:
            severity: critical
            resource: cpu
          annotations:
            summary: 'CPU Critical ({{ $labels.job }}) - {{ $value | printf "%.2f%%" }}'
            description: |
              {{ $labels.job }} is utilizing over 90% of its available CPU cores.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}

        - alert: ComponentMemoryHigh
          expr: |
            process_resident_memory_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            /
            process_memory_limit_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.75
          for: 2m
          labels:
            severity: warning
            resource: memory
          annotations:
            summary: 'Memory High ({{ $labels.job }}) - {{ $value | printf "%.2f%%" }}'
            description: |
              {{ $labels.job }} is using over 75% of its allocated memory.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}

        - alert: ComponentMemoryCritical
          expr: |
            process_resident_memory_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            /
            process_memory_limit_bytes{job=~"vlc-victoria-logs-cluster-vl.*|vlc-victoria-logs-cluster-vmauth"}
            > 0.90
          for: 2m
          labels:
            severity: critical
            resource: memory
          annotations:
            summary: 'Memory Critical ({{ $labels.job }}) - {{ $value | printf "%.2f%%" }}'
            description: |
              {{ $labels.job }} is using over 90% of its allocated memory.
              {{ if $labels.pod }}Pod: {{ $labels.pod }}{{ end }}

api:
  address: 0.0.0.0:8686
  enabled: false
  playground: true
data_dir: /vector-data-dir
sinks:
  exporter:
    address: 0.0.0.0:9090
    inputs: ['internal_metrics']
    type: prometheus_exporter
  vlogs:
    compression: gzip
    uri: 'http://vlc-victoria-logs-cluster-vlinsert.vm.svc.cluster.local:9481/insert/jsonline'
    healthcheck:
      enabled: false
    inputs: ['parser']
    type: http
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        VL-Time-Field: timestamp
        VL-Stream-Fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
        VL-Msg-Field: log,log.msg,log.message
        AccountID: '0'
        ProjectID: '0'
sources:
  internal_metrics:
    type: internal_metrics
  k8s:
    type: kubernetes_logs
transforms:
  filter:
    type: filter
    inputs: [k8s]
    condition: |
      contains(to_string!(.kubernetes.pod_namespace), "application")
  parser:
    type: remap
    inputs: [filter]
    source: |
      .log = parse_json(.message) ?? .message
      
      if !exists(.log.message) {
        # Fallback for plain text: just use the raw message
        .log.message = string!(.log)
      }
      
      timestamp = string!(.log.timestamp ?? ._time)
      level = string!(.log.level ?? "UNKNOWN")
      service = string!(.log.service ?? "unknown-service")
      txnid = string!(.log.transaction_id ?? "N/A")
      original_msg = string!(.log.message)
      
      .log.message = "time=\"{{ timestamp }}\" level={{ level }} service={{ service }} txn_id={{ txnid }} msg=\"{{ original_msg }}\""
      
      del(.message)
      del(.log.level)
      del(.log.service)
      del(.log.timestamp)
      del(.log.transaction_id)

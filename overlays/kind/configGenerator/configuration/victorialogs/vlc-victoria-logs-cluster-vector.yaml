api:
  address: 0.0.0.0:8686
  enabled: false
  playground: true
data_dir: /vector-data-dir
sinks:
  exporter:
    address: 0.0.0.0:9090
    inputs: ['internal_metrics']
    type: prometheus_exporter
  vlogs:
    compression: gzip
    uri: 'http://vlc-victoria-logs-cluster-vlinsert.vm.svc.cluster.local:9481/insert/jsonline'
    healthcheck:
      enabled: false
    inputs: ['parser']
    type: http
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        VL-Time-Field: timestamp
        VL-Msg-Field: _msg
        VL-Stream-Fields: service,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace,level,transaction_id
sources:
  internal_metrics:
    type: internal_metrics
  k8s:
    type: kubernetes_logs
transforms:
  filter:
    type: filter
    inputs: [k8s]
    condition: |
      contains(to_string!(.kubernetes.pod_namespace), "application")
  parser:
    type: remap
    inputs: [filter]
    source: |
      _msg = .message ?? .log.message
      .timestamp = .timestamp ?? .log.timestamp ?? now()
      .service = .service ?? .log.service
      .transaction_id = .transaction_id ?? .log.transaction_id
      .vector_source = "vector_agent"

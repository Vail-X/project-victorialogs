api:
  address: 0.0.0.0:8686
  enabled: false
  playground: true
data_dir: /vector-data-dir
sinks:
  exporter:
    address: 0.0.0.0:9090
    inputs: ['internal_metrics']
    type: prometheus_exporter
  vlogs:
    compression: gzip
    uri: 'http://vlc-victoria-logs-cluster-vlinsert.vm.svc.cluster.local:9481/insert/jsonline'
    healthcheck:
      enabled: false
    inputs: ['parser']
    type: http
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        VL-Time-Field: timestamp
        VL-Stream-Fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
        VL-Msg-Field: log,log.msg,log.message
        AccountID: '0'
        ProjectID: '0'
  llm_analyzer:
    compression: gzip
    uri: 'http://llm-analysis-service.application.svc.cluster.local:8080/analyze'
    healthcheck:
      enabled: false
    inputs: ['llm_data_prep']
    type: http
    method: post
    encoding:
      codec: json
sources:
  internal_metrics:
    type: internal_metrics
  k8s:
    type: kubernetes_logs
transforms:
  filter:
    type: filter
    inputs: [k8s]
    condition: |
      contains(to_string!(.kubernetes.pod_namespace), "application")
  error_filter:
    type: filter
    inputs: [parser]
    condition: |
      .log.level == "ERROR" || .log.level == "WARN" || .log.level == "FATAL"
  llm_data_prep:
    type: remap
    inputs: [error_filter]
    source: |
      .log_message = string!(.log.message)
      .log_level = .log.level

      .container_name = string!(.kubernetes.container_name)
      .pod_name = string!(.kubernetes.pod_name)
      .namespace = string!(.kubernetes.pod_namespace)
      .app_label = string!(.kubernetes.pod_labels.app)
      .job_name_label = string!(get(.kubernetes.pod_labels, "job-name"))
      .container_image = string!(.kubernetes.container_image)
      .timestamp = string!(._time)

      . = {
        "message": .log_message,
        "level": .log_level,
        "k8s_container": .container_name,
        "k8s_pod": .pod_name,
        "k8s_namespace": .namespace,
        "k8s_app_label": .app_label,
        "k8s_job_name": .job_name_label,
        "k8s_image": .container_image,
        "timestamp": .timestamp
      }
  parser:
    type: remap
    inputs: [filter]
    source: |
      .log = parse_json(.message) ?? .message

      if !exists(.log.message) {
        .log.message = string!(.log)
      }

      ts = string!(.log.timestamp)

      level = string!(.log.level)
      service = string!(.log.service)
      txnid = string!(.log.transaction_id)
      original_msg = string!(.log.message)

      .log.message = "time=\"{{ ts }}\" level={{ level }} service={{ service }} txn_id={{ txnid }} msg=\"{{ original_msg }}\""

      del(.message)
      del(.log.service)
      del(.log.timestamp)
      del(.log.transaction_id)

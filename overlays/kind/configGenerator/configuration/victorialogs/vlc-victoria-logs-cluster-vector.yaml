api:
  address: 0.0.0.0:8686
  enabled: false
  playground: true
data_dir: /vector-data-dir
sinks:
  llm_debug:
    type: console
    inputs: ['llm_data_prep']
    encoding:
      codec: json
  exporter:
    address: 0.0.0.0:9090
    inputs: ['internal_metrics']
    type: prometheus_exporter
  vlogs:
    compression: gzip
    uri: 'http://vlc-victoria-logs-cluster-vlinsert.vm.svc.cluster.local:9481/insert/jsonline'
    healthcheck:
      enabled: false
    inputs: ['parser']
    type: http
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        VL-Time-Field: timestamp
        VL-Stream-Fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
        VL-Msg-Field: log,log.msg,log.message
        AccountID: '0'
        ProjectID: '0'
  llm_analyzer:
    compression: gzip
    uri: 'http://project-log-analyzer-service.application.svc.cluster.local:8081/analyze'
    healthcheck:
      enabled: false
    inputs: ['llm_data_prep']
    type: http
    method: post
    encoding:
      codec: json
    request:
      headers:
        Content-Type: application/json

sources:
  internal_metrics:
    type: internal_metrics
  k8s:
    type: kubernetes_logs
  otel_source:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318

transforms:
  filter:
    type: filter
    inputs: [k8s]
    condition: |
      contains(to_string!(.kubernetes.pod_namespace), "application") &&
      !contains(to_string!(.kubernetes.pod_name), "project-log-analyzer")
  parser:
    type: remap
    inputs: [filter]
    source: |
      .log = parse_json(.message) ?? .message

      if !exists(.log.message) {
        .log.message = to_string(.log) ?? "unknown"
      }

      ts = to_string(.log.timestamp) ?? "unknown"
      level = to_string(.log.level) ?? "unknown"
      service = to_string(.log.service) ?? "unknown"
      txnid = to_string(.log.transaction_id) ?? "unknown"
      original_msg = to_string(.log.message) ?? "unknown"

      # Build the formatted message without problematic quotes
      .log.message = "time=" + ts + " level=" + level + " service=" + service + " txn_id=" + txnid + " msg=" + original_msg

      del(.message)
      del(.log.service)
      del(.log.timestamp)
      del(.log.transaction_id)

  error_filter:
    type: filter
    inputs: [parser]
    condition: |
      .log.level == "ERROR" || .log.level == "WARN" || .log.level == "FATAL"
  llm_data_prep:
    type: remap
    inputs: [error_filter]
    source: |
      message = to_string(.log.message) ?? "unknown"
      level = to_string(.log.level) ?? "unknown"
      ts = to_string(.timestamp) ?? "unknown"

      container_name = to_string(.kubernetes.container_name) ?? "unknown"
      pod_name = to_string(.kubernetes.pod_name) ?? "unknown"
      namespace = to_string(.kubernetes.pod_namespace) ?? "unknown"
      app_label = to_string(.kubernetes.pod_labels.app) ?? "unknown"
      job_name_label = to_string(.kubernetes.pod_labels."job-name") ?? "unknown"
      container_image = to_string(.kubernetes.container_image) ?? "unknown"

      . = {
        "message": message,
        "level": level,
        "k8s_container": container_name,
        "k8s_pod": pod_name,
        "k8s_namespace": namespace,
        "k8s_app_label": app_label,
        "k8s_job_name": job_name_label,
        "k8s_image": container_image,
        "timestamp": ts
      }
